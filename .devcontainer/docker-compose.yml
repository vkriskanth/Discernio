services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.14
    volumes:
      - ..:/workspaces/discernio:cached
    command: sleep infinity

  superset:
    image: apache/superset:latest
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    entrypoint: /bin/bash
    command: >
      -c "
      superset db upgrade &&
      (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@discernio.local --password admin || true) &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads
      "

volumes:
  superset_home:
